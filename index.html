<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Builder Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⚒️ Clash Builder Tracker</h1>

        <div class="add-account-box">
            <input type="text" id="playerName" placeholder="Nombre del jugador">

            <select id="builderCount">
                <option value="1">1 Builder</option>
                <option value="2">2 Builders</option>
                <option value="3">3 Builders</option>
                <option value="4">4 Builders</option>
                <option value="5">5 Builders</option>
                <option value="6" selected>6 Builders</option>
            </select>

            <button id="createAccountBtn">Crear Cuenta</button>
        </div>

        <div id="accountsContainer"></div>

    </div>

    <div id="builderModal" class="modal hidden">

        <div class="modal-content">

            <h2>Configurar Builder</h2>

            <input type="text" id="modalBuilding" placeholder="Nombre estructura">

            <input type="number" id="modalDays" placeholder="Días">

            <input type="number" id="modalHours" placeholder="Horas">

            <input type="number" id="modalMinutes" placeholder="Minutos">

            <button id="saveBuilderBtn">
                Guardar Timer
            </button>

            <button id="closeModalBtn">
                Cancelar
            </button>

        </div>
    </div>

    <div id="apprenticeModal" class="modal hidden">

        <div class="modal-content">

            <h2>Constructor Aprendiz</h2>

            <select id="apprenticeLevel">

                <option value="1">Nivel 1</option>
                <option value="2">Nivel 2</option>
                <option value="3">Nivel 3</option>
                <option value="4">Nivel 4</option>
                <option value="5">Nivel 5</option>
                <option value="6">Nivel 6</option>
                <option value="7">Nivel 7</option>
                <option value="8">Nivel 8</option>

            </select>

            <select id="apprenticeBuilder">

                <option value="">Sin asignar</option>

            </select>

            <label>
                <input type="checkbox" id="apprenticeSleeping">

                Está durmiendo
            </label>

            <input type="number" id="apprenticeCooldownHours" placeholder="Horas restantes">

            <input type="number" id="apprenticeCooldownMinutes" placeholder="Minutos restantes">

            <label>
                <input type="checkbox" id="apprenticeKeepWorking">
                Seguir trabajando hasta terminar
            </label>

            <button id="saveApprenticeBtn">
                Guardar
            </button>

            <button id="closeApprenticeBtn">
                Cancelar
            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- LABORATORY MODAL -->
    <!-- ========================= -->

    <div id="laboratoryModal" class="modal hidden">

        <div class="modal-content">

            <h2>🧪 Configurar Laboratorio</h2>

            <input type="text" id="laboratoryName" placeholder="Nombre investigación">

            <input type="number" id="laboratoryDays" placeholder="Días">

            <input type="number" id="laboratoryHours" placeholder="Horas">

            <input type="number" id="laboratoryMinutes" placeholder="Minutos">

            <button id="saveLaboratoryBtn">
                Guardar Investigación
            </button>

            <button id="closeLaboratoryBtn">
                Cancelar
            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- LAB ASSISTANT MODAL -->
    <!-- ========================= -->

    <div id="labAssistantModal" class="modal hidden">

        <div class="modal-content">

            <h2>👨‍🔬 Asistente de Laboratorio</h2>

            <select id="labAssistantLevel">

                <option value="1">Nivel 1</option>
                <option value="2">Nivel 2</option>
                <option value="3">Nivel 3</option>
                <option value="4">Nivel 4</option>
                <option value="5">Nivel 5</option>
                <option value="6">Nivel 6</option>
                <option value="7">Nivel 7</option>
                <option value="8">Nivel 8</option>

            </select>

            <label>

                <input type="checkbox" id="labAssistantSleeping">

                Está durmiendo

            </label>

            <input type="number" id="labAssistantCooldownHours" placeholder="Horas restantes">

            <input type="number" id="labAssistantCooldownMinutes" placeholder="Minutos restantes">

            <label>
                <input type="checkbox" id="labAssistantKeepWorking">
                Seguir trabajando hasta terminar
            </label>

            <button id="saveLabAssistantBtn">
                Guardar
            </button>

            <button id="closeLabAssistantBtn">
                Cancelar
            </button>

        </div>

    </div>

    <!-- ========================= -->
<!-- PETS MODAL -->
<!-- ========================= -->

<div id="petsModal" class="modal hidden">

    <div class="modal-content">

        <h2>🐾 Configurar Mascota</h2>

        <input
            type="text"
            id="petsName"
            placeholder="Nombre mascota"
        >

        <input
            type="number"
            id="petsDays"
            placeholder="Días"
        >

        <input
            type="number"
            id="petsHours"
            placeholder="Horas"
        >

        <input
            type="number"
            id="petsMinutes"
            placeholder="Minutos"
        >

        <button id="savePetsBtn">
            Guardar
        </button>

        <button id="closePetsBtn">
            Cancelar
        </button>

    </div>

</div>

    <!-- ========================= -->
    <!-- HELPER MODAL (Alquimista / Picador) -->
    <!-- ========================= -->

    <div id="helperModal" class="modal hidden">
        <div class="modal-content">

            <h2 id="helperModalTitle">Ayudante</h2>

            <div id="helperLevelRow" style="display:none; flex-direction:column; gap:8px;">
                <label style="font-size:13px; color:#aaa;">Nivel</label>
                <select id="helperLevel">
                    <option value="1">Nivel 1</option>
                    <option value="2">Nivel 2</option>
                    <option value="3">Nivel 3</option>
                    <option value="4">Nivel 4</option>
                    <option value="5">Nivel 5</option>
                </select>
            </div>

            <label style="font-size:13px; color:#aaa;">Tiempo restante del cooldown</label>
            <input type="number" id="helperCooldownHours" placeholder="Horas">
            <input type="number" id="helperCooldownMinutes" placeholder="Minutos">

            <button id="saveHelperBtn">Guardar</button>
            <button id="closeHelperBtn">Cancelar</button>

        </div>
    </div>

    <script src="builders.js"></script>
    <script src="laboratory.js"></script>
    <script src="pets.js"></script>
    <script src="helpers.js"></script>
    <script src="script.js"></script>
</body>

</html>
